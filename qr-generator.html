<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>QR Code Generator - Free Tools Hub</title>
  <meta name="description" content="Create QR codes for URLs and text for free.">

  <link rel="stylesheet" href="style.css">

  <style>
    .tool-page {
      width: 92%;
      max-width: 800px;
      margin: 50px auto;
    }

    .back {
      color: #76a9ff;
      text-decoration: none;
      display: inline-block;
      margin-bottom: 25px;
    }

    .tool-box {
      background: #101622;
      border: 1px solid #222d40;
      border-radius: 18px;
      padding: 25px;
    }

    .tool-box h1 {
      font-size: 30px;
      margin-bottom: 10px;
    }

    .tool-box > p {
      color: #8995a8;
      margin-bottom: 25px;
    }

    .input-label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
    }

    textarea {
      width: 100%;
      min-height: 130px;
      resize: vertical;
      padding: 14px;
      border-radius: 10px;
      border: 1px solid #303b52;
      background: #0b1019;
      color: white;
      outline: none;
      font-size: 15px;
      font-family: Arial, sans-serif;
    }

    textarea:focus {
      border-color: #76a9ff;
    }

    .size-control {
      margin-top: 20px;
    }

    .size-control label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: 600;
    }

    select {
      width: 100%;
      padding: 13px;
      border-radius: 9px;
      border: 1px solid #303b52;
      background: #0b1019;
      color: white;
      outline: none;
      font-size: 15px;
    }

    .btn {
      width: 100%;
      margin-top: 20px;
      padding: 14px;
      border: 0;
      border-radius: 10px;
      background: #76a9ff;
      color: #07101e;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
    }

    .btn:hover {
      opacity: .9;
    }

    .qr-result {
      display: none;
      text-align: center;
      margin-top: 30px;
      padding-top: 25px;
      border-top: 1px solid #222d40;
    }

    #qrcode {
      display: inline-flex;
      padding: 15px;
      background: white;
      border-radius: 12px;
    }

    #qrcode img,
    #qrcode canvas {
      display: block;
    }

    .download-btn {
      display: block;
      text-decoration: none;
      margin-top: 20px;
      padding: 14px;
      border-radius: 10px;
      background: #182237;
      color: #ffffff;
      font-weight: 700;
    }
  </style>
</head>

<body>

<header class="header">

  <div class="logo">⚡ Free Tools Hub</div>

  <button class="menu-btn" onclick="toggleMenu()">☰</button>

  <nav id="navMenu">
    <a href="index.html">Home</a>
    <a href="index.html#image">Image</a>
    <a href="index.html#pdf">PDF</a>
    <a href="index.html#qr">QR</a>
    <a href="index.html#text">Text</a>
  </nav>

</header>


<main class="tool-page">

  <a class="back" href="index.html">← Back to All Tools</a>

  <div class="tool-box">

    <h1>🔳 QR Code Generator</h1>

    <p>
      Create a QR code for any website link or text.
      No account required.
    </p>


    <label class="input-label" for="qrText">
      Enter text or URL
    </label>

    <textarea
      id="qrText"
      placeholder="https://example.com"
    ></textarea>


    <div class="size-control">

      <label for="qrSize">
        QR Code Size
      </label>

      <select id="qrSize">

        <option value="200">
          200 × 200
        </option>

        <option value="300" selected>
          300 × 300
        </option>

        <option value="500">
          500 × 500
        </option>

        <option value="800">
          800 × 800
        </option>

      </select>

    </div>


    <button
      class="btn"
      onclick="generateQR()"
    >
      🔳 Generate QR Code
    </button>


    <div
      class="qr-result"
      id="qrResult"
    >

      <h3>Your QR Code</h3>

      <br>

      <div id="qrcode"></div>

      <a
        id="downloadQR"
        class="download-btn"
        href="#"
      >
        ⬇️ Download QR Code
      </a>

    </div>

  </div>

</main>


<footer>

  <div class="footer-logo">
    ⚡ Free Tools Hub
  </div>

  <div class="footer-links">
    <a href="index.html">Home</a>
    <a href="#">Privacy Policy</a>
    <a href="#">Contact</a>
  </div>

  <p>
    © 2026 Free Tools Hub. All rights reserved.
  </p>

</footer>


<!-- QR LIBRARY -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<script src="script.js"></script>

<script>

function generateQR() {

  const text =
    document.getElementById("qrText").value.trim();

  const size =
    Number(
      document.getElementById("qrSize").value
    );

  const qrContainer =
    document.getElementById("qrcode");

  const result =
    document.getElementById("qrResult");

  const download =
    document.getElementById("downloadQR");


  if (!text) {

    alert(
      "Please enter text or a URL."
    );

    return;

  }


  qrContainer.innerHTML = "";


  new QRCode(
    qrContainer,
    {
      text: text,
      width: size,
      height: size,
      correctLevel:
        QRCode.CorrectLevel.H
    }
  );


  result.style.display =
    "block";


  setTimeout(function() {

    const canvas =
      qrContainer.querySelector(
        "canvas"
      );

    const img =
      qrContainer.querySelector(
        "img"
      );


    let dataURL = null;


    if (canvas) {

      dataURL =
        canvas.toDataURL(
          "image/png"
        );

    } else if (img) {

      dataURL =
        img.src;

    }


    if (dataURL) {

      download.href =
        dataURL;

      download.download =
        "free-tools-hub-qr.png";

    }

  }, 300);

}

</script>

</body>
</html>
