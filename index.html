/* =========================
   LOADER
========================= */

#loader{

    position:fixed;

    inset:0;

    width:100%;
    height:100%;

    background:
    radial-gradient(circle at center,
    rgba(0,255,255,.08),
    transparent 35%),

    align-items:center;
    justify-content:center;

    flex-direction:column;

    z-index:999999;

    opacity:1;
    visibility:visible;

    transition:
    opacity .5s ease,
    visibility .5s ease;
}

#loader.hide{
    opacity:0;
    visibility:hidden;
    pointer-events:none;
}

.loader-ring{

    width:75px;
    height:75px;

    border-radius:50%;

    border:3px solid rgba(255,255,255,.08);

    border-top-color:#00ffff;
    border-right-color:#9b00ff;

    box-shadow:

    0 0 35px rgba(0,255,255,.4);
}

.loader-text{

    margin-top:22px;

    font-size:18px;

    font-weight:700;

    letter-spacing:3px;

    color:#fff;

    text-shadow:
    0 0 10px #00ffff,
    0 0 20px #9b00ff;

    animation:blink 1.2s infinite;
}

@keyframes loaderSpin{
    to{
        transform:rotate(360deg);
    }
}

@keyframes blink{
    0%,100%{
        opacity:1;
    }
    50%{

    }
}

}

.orb-three{

}

@keyframes floatOrb{
