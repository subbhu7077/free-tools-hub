<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Image Compressor - Free Tools Hub</title>
  <meta name="description" content="Compress JPG, PNG and WebP images online for free.">

  <link rel="stylesheet" href="style.css">

  <style>
    .tool-page {
      width: 92%;
      max-width: 800px;
      margin: 50px auto;
    }

    .back {
      color: #76a9ff;
      text-decoration: none;
      display: inline-block;
      margin-bottom: 25px;
    }

    .tool-box {
      background: #101622;
      border: 1px solid #222d40;
      border-radius: 18px;
      padding: 25px;
    }

    .tool-box h1 {
      font-size: 30px;
      margin-bottom: 10px;
    }

    .tool-box > p {
      color: #8995a8;
      margin-bottom: 25px;
    }

    .upload-area {
      border: 2px dashed #34415b;
      border-radius: 15px;
      padding: 40px 20px;
      text-align: center;
      cursor: pointer;
    }

    .upload-area:hover {
      border-color: #76a9ff;
    }

    .upload-area input {
      display: none;
    }

    .upload-icon {
      font-size: 45px;
      margin-bottom: 10px;
    }

    .upload-area strong {
      display: block;
      margin-bottom: 5px;
    }

    .upload-area span {
      color: #8995a8;
      font-size: 13px;
    }

    .controls {
      margin-top: 25px;
    }

    .controls label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
    }

    .controls input[type="range"] {
      width: 100%;
    }

    #qualityValue {
      color: #76a9ff;
    }

    .preview {
      display: none;
      margin-top: 25px;
    }

    .preview img {
      max-width: 100%;
      max-height: 350px;
      border-radius: 12px;
      display: block;
      margin: 15px auto;
    }

    .info {
      color: #8995a8;
      font-size: 13px;
      text-align: center;
      margin: 15px 0;
    }

    .btn {
      width: 100%;
      border: 0;
      padding: 14px;
      border-radius: 10px;
      background: #76a9ff;
      color: #07101e;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
    }

    .btn:hover {
      opacity: .9;
    }

    .btn:disabled {
      opacity: .4;
      cursor: not-allowed;
    }
  </style>
</head>

<body>

<header class="header">
  <div class="logo">⚡ Free Tools Hub</div>
  <button class="menu-btn" onclick="toggleMenu()">☰</button>

  <nav id="navMenu">
    <a href="index.html">Home</a>
    <a href="index.html#image">Image</a>
    <a href="index.html#pdf">PDF</a>
    <a href="index.html#qr">QR</a>
    <a href="index.html#text">Text</a>
  </nav>
</header>


<main class="tool-page">

  <a class="back" href="index.html">← Back to All Tools</a>

  <div class="tool-box">

    <h1>🗜️ Image Compressor</h1>

    <p>
      Reduce image file size quickly and easily.
      Works directly in your browser.
    </p>


    <label class="upload-area">

      <input
        type="file"
        id="imageInput"
        accept="image/jpeg,image/png,image/webp"
      >

      <div class="upload-icon">📤</div>

      <strong>Choose an image</strong>

      <span>
        JPG, PNG or WebP
      </span>

    </label>


    <div class="controls">

      <label>
        Quality:
        <span id="qualityValue">70%</span>
      </label>

      <input
        type="range"
        id="quality"
        min="10"
        max="100"
        value="70"
      >

    </div>


    <div class="preview" id="preview">

      <h3>Preview</h3>

      <img id="previewImage" alt="Image preview">

      <div class="info" id="fileInfo"></div>

      <button class="btn" id="downloadBtn" disabled>
        ⬇️ Compress & Download
      </button>

    </div>

  </div>

</main>


<footer>

  <div class="footer-logo">
    ⚡ Free Tools Hub
  </div>

  <div class="footer-links">
    <a href="index.html">Home</a>
    <a href="#">Privacy Policy</a>
    <a href="#">Contact</a>
  </div>

  <p>© 2026 Free Tools Hub. All rights reserved.</p>

</footer>


<script src="script.js"></script>

<script>

const imageInput = document.getElementById("imageInput");
const quality = document.getElementById("quality");
const qualityValue = document.getElementById("qualityValue");
const preview = document.getElementById("preview");
const previewImage = document.getElementById("previewImage");
const fileInfo = document.getElementById("fileInfo");
const downloadBtn = document.getElementById("downloadBtn");

let selectedFile = null;

quality.addEventListener("input", () => {
  qualityValue.textContent = quality.value + "%";
});

imageInput.addEventListener("change", function () {

  selectedFile = this.files[0];

  if (!selectedFile) return;

  const reader = new FileReader();

  reader.onload = function(e) {

    previewImage.src = e.target.result;

    preview.style.display = "block";

    fileInfo.textContent =
      "Original size: " +
      formatBytes(selectedFile.size);

    downloadBtn.disabled = false;
  };

  reader.readAsDataURL(selectedFile);
});


downloadBtn.addEventListener("click", function () {

  if (!selectedFile) return;

  const reader = new FileReader();

  reader.onload = function(e) {

    const img = new Image();

    img.onload = function() {

      const canvas = document.createElement("canvas");

      canvas.width = img.width;
      canvas.height = img.height;

      const ctx = canvas.getContext("2d");

      ctx.drawImage(img, 0, 0);

      canvas.toBlob(function(blob) {

        if (!blob) {
          alert("Compression failed.");
          return;
        }

        const url = URL.createObjectURL(blob);

        const a = document.createElement("a");

        a.href = url;

        const originalName =
          selectedFile.name.replace(/\.[^/.]+$/, "");

        a.download =
          originalName + "-compressed.jpg";

        document.body.appendChild(a);

        a.click();

        a.remove();

        URL.revokeObjectURL(url);

        fileInfo.textContent =
          "Original: " +
          formatBytes(selectedFile.size) +
          " | Compressed: " +
          formatBytes(blob.size);

      }, "image/jpeg", Number(quality.value) / 100);

    };

    img.src = e.target.result;

  };

  reader.readAsDataURL(selectedFile);

});


function formatBytes(bytes) {

  if (bytes === 0) return "0 Bytes";

  const units = [
    "Bytes",
    "KB",
    "MB",
    "GB"
  ];

  const i =
    Math.floor(
      Math.log(bytes) / Math.log(1024)
    );

  return (
    (bytes / Math.pow(1024, i))
      .toFixed(2)
    + " "
    + units[i]
  );
}

</script>

</body>
</html>
